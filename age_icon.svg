<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="faceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE5B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFCC8F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fond avec coins arrondis (style iOS) -->
  <rect width="1024" height="1024" rx="225" ry="225" fill="url(#bgGradient)"/>

  <!-- Visage principal -->
  <circle cx="512" cy="400" r="200" fill="url(#faceGradient)" stroke="#D4A574" stroke-width="8"/>

  <!-- Yeux -->
  <circle cx="460" cy="360" r="25" fill="#2C3E50"/>
  <circle cx="564" cy="360" r="25" fill="#2C3E50"/>

  <!-- Pupilles -->
  <circle cx="460" cy="360" r="8" fill="#FFFFFF"/>
  <circle cx="564" cy="360" r="8" fill="#FFFFFF"/>

  <!-- Nez -->
  <ellipse cx="512" cy="410" rx="8" ry="15" fill="#E6B888"/>

  <!-- Bouche -->
  <path d="M 480 450 Q 512 470 544 450" stroke="#2C3E50" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Cheveux -->
  <path d="M 320 350 Q 350 280 420 300 Q 480 280 512 300 Q 544 280 604 300 Q 650 280 704 350 Q 680 320 640 340 Q 600 320 580 340 Q 540 320 512 340 Q 484 320 444 340 Q 404 320 384 340 Q 344 320 320 350" fill="#8B4513"/>

  <!-- Éléments technologiques - Circuit autour du visage -->
  <g stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.8">
    <!-- Lignes de connexion -->
    <path d="M 250 300 L 300 340"/>
    <path d="M 724 340 L 774 300"/>
    <path d="M 250 500 L 300 460"/>
    <path d="M 724 460 L 774 500"/>

    <!-- Points de connexion -->
    <circle cx="250" cy="300" r="8" fill="#FFFFFF"/>
    <circle cx="774" cy="300" r="8" fill="#FFFFFF"/>
    <circle cx="250" cy="500" r="8" fill="#FFFFFF"/>
    <circle cx="774" cy="500" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Chiffres d'âges flottants -->
  <g fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="bold" opacity="0.9">
    <text x="200" y="250" font-size="48">25</text>
    <text x="780" y="280" font-size="36">32</text>
    <text x="160" y="600" font-size="42">28</text>
    <text x="820" y="650" font-size="40">30</text>
  </g>

  <!-- Symbole AI/ML en bas -->
  <g transform="translate(512, 750)">
    <!-- Cerveau stylisé -->
    <path d="M -60 -40 Q -80 -60 -60 -80 Q -40 -90 -20 -80 Q 0 -85 20 -80 Q 40 -90 60 -80 Q 80 -60 60 -40 Q 70 -20 60 0 Q 50 20 30 25 Q 10 30 -10 25 Q -30 30 -50 25 Q -70 20 -60 0 Q -80 -20 -60 -40" fill="#FFFFFF" opacity="0.9"/>

    <!-- Points neuraux -->
    <circle cx="-30" cy="-50" r="4" fill="#4A90E2"/>
    <circle cx="30" cy="-50" r="4" fill="#4A90E2"/>
    <circle cx="0" cy="-30" r="4" fill="#4A90E2"/>
    <circle cx="-20" cy="-10" r="4" fill="#4A90E2"/>
    <circle cx="20" cy="-10" r="4" fill="#4A90E2"/>

    <!-- Connexions neurales -->
    <g stroke="#4A90E2" stroke-width="2" opacity="0.7">
      <line x1="-30" y1="-50" x2="0" y2="-30"/>
      <line x1="30" y1="-50" x2="0" y2="-30"/>
      <line x1="0" y1="-30" x2="-20" y2="-10"/>
      <line x1="0" y1="-30" x2="20" y2="-10"/>
    </g>
  </g>

  <!-- Effet de brillance iOS -->
  <defs>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="1024" height="512" rx="225" ry="225" fill="url(#highlight)"/>
</svg>